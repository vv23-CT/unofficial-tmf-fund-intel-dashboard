name: "Re-vote probe (test only)"
on:
  push:
    branches: [revote-test]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/chain_turnout.mjs /tmp/chain.json || true
